# Chỉ dùng khi viết migration mới, ví dụ:
#   uv run alembic revision --autogenerate -m "them cot x" --rev-id 0002
# App tự nâng database lên bản mới nhất khi khởi động (minicloud/migrate.py).
# Database lấy từ MINICLOUD_DATABASE_URL (mặc định sqlite:///./minicloud.db).

[alembic]
script_location = src/minicloud/migrations
file_template = %%(rev)s_%%(slug)s

# Migration mới sinh ra được ruff sửa import và định dạng luôn.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
