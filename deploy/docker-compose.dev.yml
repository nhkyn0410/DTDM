# Dịch vụ phụ khi phát triển.
#   PostgreSQL:              docker compose -f deploy/docker-compose.dev.yml up -d
#   Thêm Prometheus/Grafana: docker compose -f deploy/docker-compose.dev.yml --profile monitoring up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minicloud
      POSTGRES_PASSWORD: minicloud # chỉ dùng khi phát triển
      POSTGRES_DB: minicloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    ports:
      - "3000:3000" # trùng cổng portal: đổi một bên nếu chạy cùng lúc
    volumes:
      - grafana:/var/lib/grafana

volumes:
  pgdata:
  grafana:
